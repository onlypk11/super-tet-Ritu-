<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>रितु के सुपर TET नोट्स ❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbfaf4;--line:#d6e0ee;--ink:#1f2a5c;--text:#23262f;--muted:#5d6475;--margin:#c4423a;--chip:#eef1fa;--done:#2f7d4f;--card:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#171a24;--line:#262c3d;--ink:#a9b8ff;--text:#e6e8ef;--muted:#9aa2b8;--margin:#e0665e;--chip:#222839;--done:#6fcf97;--card:#1d2130}}
:root[data-theme="dark"]{--paper:#171a24;--line:#262c3d;--ink:#a9b8ff;--text:#e6e8ef;--muted:#9aa2b8;--margin:#e0665e;--chip:#222839;--done:#6fcf97;--card:#1d2130}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--paper);color:var(--text);font:400 17px/1.75 "Hind",system-ui,sans-serif;
background-image:repeating-linear-gradient(transparent 0,transparent 33px,var(--line) 33px,var(--line) 34px)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px 28px;border-left:2px solid var(--margin);min-height:100vh;background:color-mix(in srgb,var(--paper) 55%,transparent)}
h1{font:400 clamp(30px,6vw,44px)/1.2 "Tiro Devanagari Hindi",serif;color:var(--ink);margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .3s}
#pt{font-size:14px;color:var(--muted);margin:6px 0 14px}
input[type=search]{width:100%;padding:10px 14px;font:inherit;border:1.5px solid var(--ink);border-radius:8px;background:var(--card);color:var(--text)}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5}
nav button{flex:none;font:500 15px "Hind",sans-serif;padding:6px 14px;border-radius:999px;border:1.5px solid var(--ink);background:var(--chip);color:var(--ink);cursor:pointer}
nav button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--margin);outline-offset:2px}
h2{font:400 26px "Tiro Devanagari Hindi",serif;color:var(--ink);margin:26px 0 8px}
details{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:6px;margin:10px 0;padding:0 14px}
details.done{border-left-color:var(--done)}
summary{cursor:pointer;font-weight:600;padding:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
summary label{font-weight:400;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
details ul{margin:0 0 12px;padding-left:20px}
details li{margin:4px 0}
.empty{color:var(--muted);padding:20px 0}
.ded{text-align:center;border:1.5px solid var(--margin);border-radius:14px;padding:16px 16px 14px;margin:6px 0 16px;background:color-mix(in srgb,var(--margin) 8%,var(--card))}
.hrt{font-size:32px;line-height:1.2;color:var(--margin);animation:bt 1.6s ease-in-out infinite}
@keyframes bt{50%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.hrt{animation:none}}
.to{font:400 clamp(22px,5vw,30px)/1.3 "Tiro Devanagari Hindi",serif;color:var(--ink);margin:4px 0}
.ms{margin:6px 0}.sg{color:var(--muted);font-size:15px;margin:0}
.cheer{color:var(--margin);font-weight:600;margin:0 0 12px}
.sec h3{font:600 18px "Hind",sans-serif;color:var(--ink);margin:14px 0 4px;padding-bottom:3px;border-bottom:1px dashed var(--line)}
.sub h4{margin:8px 0 1px;font-size:16px;font-weight:600;color:var(--margin)}
.sub p{margin:0 0 6px}
.qq{margin:18px 0}.qq p{margin:0 0 6px;font-weight:600}
.op{display:block;width:100%;text-align:left;font:inherit;padding:8px 12px;margin:5px 0;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer}
.op.sel{border-color:var(--ink);background:var(--chip)}
.op.ok{border-color:var(--done);background:color-mix(in srgb,var(--done) 22%,var(--card))}
.op.bad{border-color:var(--margin);background:color-mix(in srgb,var(--margin) 22%,var(--card))}
.go{font:600 16px "Hind",sans-serif;padding:10px 22px;border-radius:8px;border:0;background:var(--ink);color:var(--paper);cursor:pointer}
.res{font-size:20px;color:var(--ink);font-weight:600}
.note{font-size:14px;color:var(--muted);margin-top:30px;border-top:1px dashed var(--muted);padding-top:12px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
:root{--l:40%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--l:70%}}
:root[data-theme="dark"]{--l:70%}
h1{background:linear-gradient(90deg,#e91e63,#ff9800,#2196f3,#8e24aa);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.bar{height:12px;border-radius:8px}
.bar i{background:linear-gradient(90deg,#ff5f6d,#ffc371,#47d18c,#4facfe)}
.ded{background:linear-gradient(135deg,color-mix(in srgb,#ff6fa5 18%,var(--card)),color-mix(in srgb,#ffb74d 18%,var(--card)));box-shadow:0 6px 18px color-mix(in srgb,var(--margin) 22%,transparent)}
.cheer{background:linear-gradient(90deg,#ff6fa5,#ff9800);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;font-size:18px}
nav button{--hc:hsl(var(--h,230) 70% var(--l));border-color:var(--hc);background:color-mix(in srgb,var(--hc) 13%,var(--paper));color:var(--hc);transition:transform .15s}
nav button:hover{transform:translateY(-2px)}
nav button[aria-pressed=true]{background:var(--hc);color:#fff}
h2{color:hsl(var(--h,230) 70% var(--l));padding-left:10px;border-left:6px solid hsl(var(--h,230) 75% 55%)}
details{--hc:hsl(var(--h,230) 70% var(--l));border-left-color:var(--hc);background:color-mix(in srgb,var(--hc) 5%,var(--card));border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .15s,box-shadow .15s}
details:hover{transform:translateY(-2px)}
details[open]{box-shadow:0 6px 18px color-mix(in srgb,var(--hc) 25%,transparent)}
summary{color:var(--hc)}
details.done{border-left-color:var(--done)}
details.done summary>span::after{content:" ✅"}
.sec h3{color:var(--hc);border-bottom:2px dashed var(--hc)}
.sub h4{color:hsl(calc(var(--h,230) + 160) 65% var(--l))}
.sub h4::before{content:"▸ "}
.op{transition:transform .12s,border-color .12s}
.op:hover{border-color:var(--ink);transform:translateX(3px)}
.go{background:linear-gradient(90deg,#e91e63,#ff9800);color:#fff}
.cf{position:fixed;width:8px;height:8px;border-radius:2px;z-index:99;pointer-events:none;animation:cf .9s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion:reduce){details,nav button,.op{transition:none}details:hover,nav button:hover,.op:hover{transform:none}}
.ded{cursor:pointer}
.hint{color:var(--muted);font-size:14px;margin:2px 0 0}
.ded.open .hint{display:none}
.msg{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s ease,opacity .45s ease}
.msg>div{overflow:hidden}
.ded.open .msg{grid-template-rows:1fr;opacity:1}
@media (prefers-reduced-motion:reduce){.msg{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<section class="ded" id="ded" role="button" tabindex="0" aria-expanded="false" aria-label="Dedication"><div class="hrt" aria-hidden="true">❤</div><p class="to" id="to"></p><p class="hint" id="hint"></p><div class="msg"><div><p class="ms" id="ms"></p><p class="sg" id="sg"></p></div></div></section>
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1 id="h1">सुपर TET नोट्स</h1><button class="go" id="lg" style="padding:6px 14px;font-size:14px">English</button></div>
<p class="sub" id="sb">UP Super TET (प्राइमरी, कक्षा 1–5) के लिए विषयवार संक्षिप्त नोट्स। टॉपिक पढ़ने के बाद “पढ़ लिया” पर टिक करें।</p>
<div class="bar"><i id="pb"></i></div>
<div id="pt"></div><div id="ch" class="cheer"></div>
<input type="search" id="q" placeholder="टॉपिक खोजें, जैसे: संधि, पियाजे, RTE" aria-label="खोजें">
<nav id="nav" aria-label="विषय"></nav>
<main id="list"></main>
<p class="note" id="nt">ये नोट्स रिवीजन के लिए संक्षिप्त हैं। पूरा पाठ्यक्रम upbeb.org पर दी गई आधिकारिक PDF से मिलाकर देखें। करंट अफेयर्स रोज़ अख़बार या मासिक पत्रिका से अलग से पढ़ें।</p>
</div>

["संधि: परीक्षा के महत्वपूर्ण प्रश्न (उत्तर सहित)",["संधि किसे कहते हैं? दो वर्णों के मेल से होने वाला परिवर्तन।","संधि के कितने प्रकार हैं? 3 (स्वर, व्यंजन, विसर्ग)। स्वर संधि के कितने भेद? 5।","विद्यालय का संधि-विच्छेद? विद्या+आलय (दीर्घ स्वर संधि)।","महोत्सव में कौन-सी संधि? गुण (महा+उत्सव)।","सदैव में कौन-सी संधि? वृद्धि (सदा+एव)।","सज्जन में कौन-सी संधि? व्यंजन (सत्+जन)।","मनोहर में कौन-सी संधि? विसर्ग (मनः+हर)।"]]
);

{h:"3. स्वर संधि (5 भेद)",subs:[
["(1) दीर्घ संधि","जब समान स्वर आपस में मिलते हैं, तो दीर्घ स्वर बनता है। अ+अ = आ (धर्म+अर्थ = धर्मार्थ); अ+आ = आ (हिम+आलय = हिमालय); इ+इ = ई (रवि+इंद्र = रवींद्र); उ+उ = ऊ (सु+उक्ति = सूक्ति)।"],
["(2) गुण संधि","अ या आ के बाद इ/ई, उ/ऊ या ऋ आए, तो क्रमशः ए, ओ और अर् हो जाता है। नर+इंद्र = नरेंद्र; महा+उत्सव = महोत्सव; देव+ऋषि = देवर्षि।"],
["(3) वृद्धि संधि","अ या आ के बाद ए/ऐ या ओ/औ आए, तो क्रमशः ऐ और औ हो जाता है। सदा+एव = सदैव; महा+औषधि = महौषधि।"],
["(4) यण संधि","इ, ई, उ, ऊ या ऋ के बाद कोई अलग स्वर आए, तो वे क्रमशः य्, व् और र् में बदल जाते हैं। इति+आदि = इत्यादि; सु+आगत = स्वागत; पितृ+आदेश = पित्रादेश।"],
["(5) अयादि संधि","ए, ऐ, ओ, औ के बाद कोई स्वर आए, तो वे क्रमशः अय्, आय्, अव् और आव् में बदल जाते हैं। ने+अन = नयन; गै+अक = गायक; भो+अन = भवन; नौ+इक = नाविक।"]]},
{h:"4. व्यंजन संधि",subs:[["परिभाषा","जब एक व्यंजन के बाद किसी स्वर या व्यंजन के आने से व्यंजन में परिवर्तन होता है, तो उसे व्यंजन संधि कहते हैं।"],["उदाहरण","सज्जन = सत्+जन; उच्चारण = उत्+चारण; दिग्गज = दिक्+गज; जगन्नाथ = जगत्+नाथ; सच्चरित्र = सत्+चरित्र; सद्गुण = सत्+गुण।"]]},
{h:"5. विसर्ग संधि",subs:[["परिभाषा","जब विसर्ग (ः) के बाद स्वर या व्यंजन आने से विसर्ग में परिवर्तन होता है, तो उसे विसर्ग संधि कहते हैं।"],["उदाहरण","मनोहर = मनः+हर; तपोवन = तपः+वन; निराशा = निः+आशा; नमस्कार = नमः+कार; निश्चय = निः+चय; दुर्जन = दुः+जन।"]]},
{h:"6. परीक्षा के महत्वपूर्ण प्रश्न",subs:[["संधि किसे कहते हैं?","दो वर्णों के मेल से होने वाला परिवर्तन।"],["संधि के कितने प्रकार हैं? स्वर संधि के कितने भेद?","3 प्रकार (स्वर, व्यंजन, विसर्ग); स्वर संधि के 5 भेद।"],["विद्यालय का संधि-विच्छेद?","विद्या + आलय (दीर्घ स्वर संधि)।"],["महोत्सव में कौन-सी संधि?","गुण (महा + उत्सव)।"],["सदैव में कौन-सी संधि?","वृद्धि (सदा + एव)।"],["सज्जन में कौन-सी संधि?","व्यंजन (सत् + जन)।"],["मनोहर में कौन-सी संधि?","विसर्ग (मनः + हर)।"]]}

S[0].t[1]=mk("अध्याय: समास",[
{h:"1. समास की परिभाषा",subs:[["परिभाषा","दो या दो से अधिक शब्दों (पदों) के मेल से बने नए सार्थक शब्द को समास कहते हैं।"],["मुख्य शब्द","समास से बने शब्द को समस्त पद कहते हैं। उसे तोड़कर लिखना समास-विग्रह है। पहला शब्द पूर्वपद और दूसरा उत्तरपद कहलाता है। उदाहरण: राजपुत्र (समस्त पद) = राजा का पुत्र (विग्रह)।"]]},

["(1) अव्ययीभाव समास","पहला पद अव्यय होता है और वही प्रधान होता है; पूरा समस्त पद अव्यय की तरह काम करता है। उदाहरण: यथाशक्ति (शक्ति के अनुसार), प्रतिदिन (हर दिन), आजन्म (जन्म से लेकर), यथासंभव, भरपेट।"],
["(2) तत्पुरुष समास","उत्तरपद प्रधान होता है और पूर्वपद में कारक चिह्न (को, से, के लिए, से अलग, का, में/पर) का लोप रहता है। कर्म: स्वर्गप्राप्त (स्वर्ग को प्राप्त); करण: तुलसीकृत (तुलसी से कृत); संप्रदान: रसोईघर (रसोई के लिए घर); अपादान: देशनिकाला (देश से निकाला); संबंध: राजपुत्र (राजा का पुत्र); अधिकरण: नगरवास (नगर में वास)।"],
["नञ् तत्पुरुष","पहला पद निषेध बताता है (अ/अन)। उदाहरण: अन्याय (न न्याय), अनादि (न आदि), अधर्म (न धर्म)।"],
["(3) कर्मधारय समास","विशेषण-विशेष्य या उपमान-उपमेय का संबंध होता है; उत्तरपद प्रधान। उदाहरण: नीलकमल (नीला है जो कमल), महापुरुष (महान है जो पुरुष), चंद्रमुख (चंद्र के समान मुख), कमलनयन (कमल के समान नयन)।"],
["(4) द्विगु समास","पूर्वपद संख्यावाचक होता है और समूह या समाहार का बोध कराता है। उदाहरण: त्रिभुवन (तीन भुवनों का समूह), चौराहा (चार राहों का समाहार), पंचवटी (पाँच वटों का समूह), नवरत्न, सप्ताह।"],
["(5) द्वंद्व समास","दोनों पद प्रधान होते हैं; विग्रह में 'और', 'तथा', 'या' आता है। उदाहरण: माता-पिता (माता और पिता), दाल-रोटी, राम-लक्ष्मण, भाई-बहन, सुख-दुख, अन्न-जल।"],
["(6) बहुव्रीहि समास","दोनों पद मिलकर किसी तीसरे (अन्य) अर्थ का बोध कराते हैं। उदाहरण: दशानन (दस हैं मुख जिसके = रावण), चक्रधर (चक्र धारण करने वाला = विष्णु), लंबोदर (लंबा है उदर जिसका = गणेश), पीतांबर (पीला है अंबर जिसका = कृष्ण), नीलकंठ (नीला है कंठ जिसका = शिव)।"]]},
{h:"4. भेद पहचानने की ट्रिक",subs:[

["द्विगु और बहुव्रीहि में अंतर","द्विगु में संख्या समूह बताती है (चौराहा = चार राहों का समूह)। बहुव्रीहि में संख्या किसी विशेष व्यक्ति का नाम बन जाती है (त्रिनेत्र = शिव)।"],
["विग्रह से पहचान","कारक चिह्न छिपा हो तो तत्पुरुष; 'और' हो तो द्वंद्व; 'के समान/है जो' हो तो कर्मधारय; संख्या से शुरुआत हो तो द्विगु; 'जिसका/जिसके' हो तो बहुव्रीहि; 'यथा, प्रति, आ' से शुरुआत हो तो अव्ययीभाव।"]]}

["कृत् प्रत्यय (धातु से)","क्रिया की धातु में जुड़ते हैं। पढ़ + आई = पढ़ाई; लिख + आवट = लिखावट; चढ़ + आई = चढ़ाई; घट + ना = घटना।"],
["तद्धित प्रत्यय (संज्ञा, विशेषण से)","संज्ञा या विशेषण में जुड़ते हैं। अपना + पन = अपनापन; मानव + ता = मानवता; बूढ़ा + पा = बुढ़ापा; चतुर + आई = चतुराई; ग़रीब + ई = ग़रीबी।"],
["स्त्रीलिंग प्रत्यय","ई, इन, आनी, इका, नी: माली → मालिन; नौकर → नौकरानी; बालक → बालिका; शेर → शेरनी।"]]},
{h:"3. उपसर्ग और प्रत्यय में अंतर",subs:[["याद रखें","उपसर्ग शब्द से पहले लगता है, प्रत्यय शब्द के बाद। उपसर्ग से शब्द का अर्थ बदलता है (वि + देश = विदेश), प्रत्यय से नया शब्द बनता है (मानव + ता = मानवता)।"]]},

S[4].t[3]=mk("अध्याय: प्राचीन भारत का इतिहास",[

{h:"2. प्रागैतिहासिक काल",subs:[["पाषाण काल","पुरापाषाण में आग की खोज और शिकार। नवपाषाण में खेती, पशुपालन और पहिये का आविष्कार। भीमबेटका (म.प्र.) के शैलचित्र प्रसिद्ध हैं; मेहरगढ़ प्रमुख नवपाषाण स्थल है।"],["ताम्र-पाषाण और लौह काल","तांबे के औजार शुरू हुए; बाद में लोहे के प्रयोग से खेती और सभ्यता में बड़ा बदलाव आया।"]]},
{h:"3. सिंधु घाटी सभ्यता",subs:[["खोज और काल","1921 में हड़प्पा (दयाराम साहनी) और 1922 में मोहनजोदड़ो (राखालदास बनर्जी)। परिपक्व अवस्था लगभग 2600–1900 ई.पू. मानी जाती है।"],["नगर नियोजन","सड़कें काटकोण पर (ग्रिड), पक्की ईंटें, ढकी नालियाँ, मोहनजोदड़ो का विशाल स्नानागार, अन्नागार।"],["प्रमुख स्थल","कालीबंगा (राजस्थान), लोथल (गुजरात, बंदरगाह), धोलावीरा (गुजरात, जल प्रबंधन), राखीगढ़ी (हरियाणा)।"],["अन्य तथ्य","लिपि अभी पढ़ी नहीं गई। मुहरें, पशुपति मुहर, कांसे की नर्तकी प्रसिद्ध हैं। मेसोपोटामिया से व्यापार था।"]]},

{h:"6. मौर्य साम्राज्य",subs:[["चंद्रगुप्त मौर्य","स्थापना 321 ई.पू.। सलाहकार चाणक्य (कौटिल्य), ग्रंथ अर्थशास्त्र। सेल्यूकस का दूत मेगस्थनीज़ इसी काल में आया।"],["अशोक","कलिंग युद्ध 261 ई.पू. के बाद बौद्ध धर्म अपनाया और ‘धम्म’ की नीति चलाई। शिलालेख ब्राह्मी लिपि में मिलते हैं। सारनाथ का सिंह स्तंभ भारत का राष्ट्रीय चिह्न है।"],["पतन","अंतिम शासक बृहद्रथ को सेनापति पुष्यमित्र शुंग ने मारा और शुंग वंश की नींव रखी।"]]},
{h:"7. गुप्त काल (स्वर्ण युग)",subs:[["प्रमुख शासक","चंद्रगुप्त प्रथम; समुद्रगुप्त (भारत का नेपोलियन, प्रयाग प्रशस्ति); चंद्रगुप्त द्वितीय (विक्रमादित्य, नवरत्न, कालिदास, फाह्यान इसी के समय); कुमारगुप्त (नालंदा विश्वविद्यालय); स्कंदगुप्त (हूण आक्रमण)।"],["विज्ञान और कला","आर्यभट्ट (शून्य, दशमलव प्रणाली, पृथ्वी का घूर्णन), वराहमिहिर, कालिदास (अभिज्ञानशाकुंतलम्)।"]]},

{h:"2. 1857 का विद्रोह",subs:[["कारण","चर्बी वाले कारतूस, हड़प नीति, आर्थिक शोषण और धार्मिक आशंकाएँ।"],["घटनाक्रम","10 मई 1857 को मेरठ से शुरू। नेता: बहादुर शाह ज़फ़र (दिल्ली), रानी लक्ष्मीबाई (झाँसी), नाना साहब और तात्या टोपे (कानपुर), बेगम हज़रत महल (लखनऊ), कुँवर सिंह (बिहार)।"],["परिणाम","विद्रोह असफल रहा। कंपनी शासन ख़त्म, शासन ताज के अधीन; 1858 की महारानी विक्टोरिया की घोषणा।"]]},
{h:"3. सामाजिक-धार्मिक सुधार",subs:[["प्रमुख सुधारक","राजा राममोहन राय (ब्रह्म समाज 1828, सती प्रथा अंत 1829); दयानंद सरस्वती (आर्य समाज 1875); विवेकानंद (रामकृष्ण मिशन 1897); ईश्वरचंद्र विद्यासागर (विधवा पुनर्विवाह 1856); ज्योतिबा फुले (सत्यशोधक समाज); सर सैयद अहमद खान (अलीगढ़)।"]]},
