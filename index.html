<p class="note" id="nt">ये नोट्स रिवीजन के लिए संक्षिप्त हैं। पूरा पाठ्यक्रम upbeb.org पर दी गई आधिकारिक PDF से मिलाकर देखें। करंट अफेयर्स रोज़ अख़बार या मासिक पत्रिका से अलग से पढ़ें।</p>

["संधि: परीक्षा के महत्वपूर्ण प्रश्न (उत्तर सहित)",["संधि किसे कहते हैं? दो वर्णों के मेल से होने वाला परिवर्तन।","संधि के कितने प्रकार हैं? 3 (स्वर, व्यंजन, विसर्ग)। स्वर संधि के कितने भेद? 5।","विद्यालय का संधि-विच्छेद? विद्या+आलय (दीर्घ स्वर संधि)।","महोत्सव में कौन-सी संधि? गुण (महा+उत्सव)।","सदैव में कौन-सी संधि? वृद्धि (सदा+एव)।","सज्जन में कौन-सी संधि? व्यंजन (सत्+जन)।","मनोहर में कौन-सी संधि? विसर्ग (मनः+हर)।"]]
);

{h:"3. स्वर संधि (5 भेद)",subs:[
["(1) दीर्घ संधि","जब समान स्वर आपस में मिलते हैं, तो दीर्घ स्वर बनता है। अ+अ = आ (धर्म+अर्थ = धर्मार्थ); अ+आ = आ (हिम+आलय = हिमालय); इ+इ = ई (रवि+इंद्र = रवींद्र); उ+उ = ऊ (सु+उक्ति = सूक्ति)।"],
["(2) गुण संधि","अ या आ के बाद इ/ई, उ/ऊ या ऋ आए, तो क्रमशः ए, ओ और अर् हो जाता है। नर+इंद्र = नरेंद्र; महा+उत्सव = महोत्सव; देव+ऋषि = देवर्षि।"],
["(3) वृद्धि संधि","अ या आ के बाद ए/ऐ या ओ/औ आए, तो क्रमशः ऐ और औ हो जाता है। सदा+एव = सदैव; महा+औषधि = महौषधि।"],
["(4) यण संधि","इ, ई, उ, ऊ या ऋ के बाद कोई अलग स्वर आए, तो वे क्रमशः य्, व् और र् में बदल जाते हैं। इति+आदि = इत्यादि; सु+आगत = स्वागत; पितृ+आदेश = पित्रादेश।"],
["(5) अयादि संधि","ए, ऐ, ओ, औ के बाद कोई स्वर आए, तो वे क्रमशः अय्, आय्, अव् और आव् में बदल जाते हैं। ने+अन = नयन; गै+अक = गायक; भो+अन = भवन; नौ+इक = नाविक।"]]},
{h:"4. व्यंजन संधि",subs:[["परिभाषा","जब एक व्यंजन के बाद किसी स्वर या व्यंजन के आने से व्यंजन में परिवर्तन होता है, तो उसे व्यंजन संधि कहते हैं।"],["उदाहरण","सज्जन = सत्+जन; उच्चारण = उत्+चारण; दिग्गज = दिक्+गज; जगन्नाथ = जगत्+नाथ; सच्चरित्र = सत्+चरित्र; सद्गुण = सत्+गुण।"]]},
{h:"5. विसर्ग संधि",subs:[["परिभाषा","जब विसर्ग (ः) के बाद स्वर या व्यंजन आने से विसर्ग में परिवर्तन होता है, तो उसे विसर्ग संधि कहते हैं।"],["उदाहरण","मनोहर = मनः+हर; तपोवन = तपः+वन; निराशा = निः+आशा; नमस्कार = नमः+कार; निश्चय = निः+चय; दुर्जन = दुः+जन।"]]},
{h:"6. परीक्षा के महत्वपूर्ण प्रश्न",subs:[["संधि किसे कहते हैं?","दो वर्णों के मेल से होने वाला परिवर्तन।"],["संधि के कितने प्रकार हैं? स्वर संधि के कितने भेद?","3 प्रकार (स्वर, व्यंजन, विसर्ग); स्वर संधि के 5 भेद।"],["विद्यालय का संधि-विच्छेद?","विद्या + आलय (दीर्घ स्वर संधि)।"],["महोत्सव में कौन-सी संधि?","गुण (महा + उत्सव)।"],["सदैव में कौन-सी संधि?","वृद्धि (सदा + एव)।"],["सज्जन में कौन-सी संधि?","व्यंजन (सत् + जन)।"],["मनोहर में कौन-सी संधि?","विसर्ग (मनः + हर)।"]]}

S[0].t[1]=mk("अध्याय: समास",[
{h:"1. समास की परिभाषा",subs:[["परिभाषा","दो या दो से अधिक शब्दों (पदों) के मेल से बने नए सार्थक शब्द को समास कहते हैं।"],["मुख्य शब्द","समास से बने शब्द को समस्त पद कहते हैं। उसे तोड़कर लिखना समास-विग्रह है। पहला शब्द पूर्वपद और दूसरा उत्तरपद कहलाता है। उदाहरण: राजपुत्र (समस्त पद) = राजा का पुत्र (विग्रह)।"]]},

["(2) तत्पुरुष समास","उत्तरपद प्रधान होता है और पूर्वपद में कारक चिह्न (को, से, के लिए, से अलग, का, में/पर) का लोप रहता है। कर्म: स्वर्गप्राप्त (स्वर्ग को प्राप्त); करण: तुलसीकृत (तुलसी से कृत); संप्रदान: रसोईघर (रसोई के लिए घर); अपादान: देशनिकाला (देश से निकाला); संबंध: राजपुत्र (राजा का पुत्र); अधिकरण: नगरवास (नगर में वास)।"],
["नञ् तत्पुरुष","पहला पद निषेध बताता है (अ/अन)। उदाहरण: अन्याय (न न्याय), अनादि (न आदि), अधर्म (न धर्म)।"],
["(3) कर्मधारय समास","विशेषण-विशेष्य या उपमान-उपमेय का संबंध होता है; उत्तरपद प्रधान। उदाहरण: नीलकमल (नीला है जो कमल), महापुरुष (महान है जो पुरुष), चंद्रमुख (चंद्र के समान मुख), कमलनयन (कमल के समान नयन)।"],
["(4) द्विगु समास","पूर्वपद संख्यावाचक होता है और समूह या समाहार का बोध कराता है। उदाहरण: त्रिभुवन (तीन भुवनों का समूह), चौराहा (चार राहों का समाहार), पंचवटी (पाँच वटों का समूह), नवरत्न, सप्ताह।"],
["(5) द्वंद्व समास","दोनों पद प्रधान होते हैं; विग्रह में 'और', 'तथा', 'या' आता है। उदाहरण: माता-पिता (माता और पिता), दाल-रोटी, राम-लक्ष्मण, भाई-बहन, सुख-दुख, अन्न-जल।"],
["(6) बहुव्रीहि समास","दोनों पद मिलकर किसी तीसरे (अन्य) अर्थ का बोध कराते हैं। उदाहरण: दशानन (दस हैं मुख जिसके = रावण), चक्रधर (चक्र धारण करने वाला = विष्णु), लंबोदर (लंबा है उदर जिसका = गणेश), पीतांबर (पीला है अंबर जिसका = कृष्ण), नीलकंठ (नीला है कंठ जिसका = शिव)।"]]},

["विग्रह से पहचान","कारक चिह्न छिपा हो तो तत्पुरुष; 'और' हो तो द्वंद्व; 'के समान/है जो' हो तो कर्मधारय; संख्या से शुरुआत हो तो द्विगु; 'जिसका/जिसके' हो तो बहुव्रीहि; 'यथा, प्रति, आ' से शुरुआत हो तो अव्ययीभाव।"]]}

["तद्धित प्रत्यय (संज्ञा, विशेषण से)","संज्ञा या विशेषण में जुड़ते हैं। अपना + पन = अपनापन; मानव + ता = मानवता; बूढ़ा + पा = बुढ़ापा; चतुर + आई = चतुराई; ग़रीब + ई = ग़रीबी।"],

S[9].t.push(HS("संस्कृत व्याकरण: माहेश्वर सूत्र, वर्ण और अष्टाध्यायी",[["1. माहेश्वर सूत्र और प्रत्याहार",[["परिचय","14 माहेश्वर सूत्र पाणिनि को भगवान शिव की कृपा से मिले। अंत के हलन्त वर्ण 'इत्' संज्ञक हैं, जिनका लोप 'तस्य लोपः' से होता है।"],["मुख्य प्रत्याहार","अच् = सभी स्वर; हल् = सभी व्यंजन; अल् = सभी वर्ण; यण् = अन्तःस्थ; शल् = ऊष्म। 'ह' वर्ण दो बार आया है।"],["सूत्र और संख्या","प्रत्याहार बनाने वाला सूत्र: आदिरन्त्येन सहेता। लघुसिद्धान्तकौमुदी के अनुसार कुल 42 प्रत्याहार हैं।"]]],["2. उच्चारण स्थान",[["कण्ठ, तालु, मूर्धा","अ कु ह विसर्ग = कण्ठ; इ चु य श = तालु; ऋ टु र ष = मूर्धा।"],["दन्त, ओष्ठ, नासिका","लृ तु ल स = दन्त; उ पु उपध्मानीय = ओष्ठ; ङ ञ ण न म = नासिका।"],["संयुक्त स्थान","ए ऐ = कण्ठतालु; ओ औ = कण्ठोष्ठ; व = दन्तोष्ठ।"]]],["3. प्रयत्न, स्वर और मात्रा",[["आभ्यन्तर प्रयत्न (5)","स्पर्श = स्पृष्टम्; अन्तःस्थ = ईषत्स्पृष्टम्; ऊष्म = ईषद्विवृतम्; स्वर = विवृतम्। बाह्य प्रयत्न 11 हैं।"],["गिनती","ह्रस्व स्वर 5; कुल स्वर (अच्) 9; अयोगवाह 4; स्पर्श व्यंजन 25 (क से म)।"],["मात्रा","ह्रस्व = 1; दीर्घ = 2; प्लुत = 3; व्यंजन = अर्धमात्रा।"]]],["4. अष्टाध्यायी और पाणिनि परम्परा",[["मुनित्रय","पाणिनि (अष्टाध्यायी), कात्यायन/वररुचि (वार्तिक), पतञ्जलि (महाभाष्य)।"],["संरचना","8 अध्याय, प्रत्येक में 4 पाद, लगभग 4000 सूत्र। पहला सूत्र वृद्धिरादैच्, अंतिम सूत्र अ अ।"],["सूत्र के 6 प्रकार","संज्ञा, परिभाषा, विधि, निषेध, अधिकार, अतिदेश। जैसे वृद्धिरादैच् और अदेङ् गुणः संज्ञा सूत्र हैं; इको यणचि, आद्गुणः, तस्य लोपः विधि सूत्र हैं।"]]]]));
S[9].t.push(HS("संस्कृत व्याकरण: संधि",[["1. आधार",[["संहिता","वर्णों की अत्यंत समीपता को संहिता कहते हैं (परः सन्निकर्षः संहिता)।"]]],["2. स्वर संधि",[["दीर्घ","सूत्र: अकः सवर्णे दीर्घः। विद्या+आलयः = विद्यालयः; कपि+इन्द्रः = कपीन्द्रः; भानु+उदयः = भानूदयः।"],["गुण","सूत्र: आद्गुणः (गुण संज्ञा: अदेङ् गुणः)। रमा+ईशः = रमेशः; सूर्य+उदयः = सूर्योदयः; देव+ऋषिः = देवर्षिः।"],["वृद्धि","सूत्र: वृद्धिरेचि। सदा+एव = सदैव; तथा+एव = तथैव; मत+ऐक्यम् = मतैक्यम्; वन+औषधिः = वनौषधिः।"],["यण्","सूत्र: इको यणचि। यदि+अपि = यद्यपि; इति+आदि = इत्यादि; मधु+अरिः = मध्वरिः; सु+आगतम् = स्वागतम्।"],["अयादि","सूत्र: एचोऽयवायावः। ने+अनम् = नयनम्; नै+अकः = नायकः; पौ+अकः = पावकः; नौ+इकः = नाविकः।"],["पूर्वरूप और पररूप","पूर्वरूप: एङः पदान्तादति (हरे+अव = हरेऽव; चिह्न ऽ = अवग्रह)। पररूप: एङि पररूपम् (प्र+एजते = प्रेजते; उप+ओषति = उपोषति)। प्रकृतिभाव: प्लुतप्रगृह्या अचि नित्यम्।"]]],["3. व्यंजन (हल्) संधि",[["श्चुत्व और ष्टुत्व","श्चुत्व: स्तोः श्चुना श्चुः (सत्+जनः = सज्जनः)। ष्टुत्व: ष्टुना ष्टुः (तत्+टीका = तट्टीका)।"],["जश्त्व और चर्त्व","जश्त्व: झलां जशोऽन्ते (वाक्+ईशः = वागीशः; जगत्+ईशः = जगदीशः; दिक्+अम्बरः = दिगम्बरः)। चर्त्व: खरि च (सद्+कारः = सत्कारः)।"],["अनुस्वार और परसवर्ण","मोऽनुस्वारः (हरिं वन्दे; सत्यं वद)। अनुस्वारस्य ययि परसवर्णः (शान्तः)।"],["लत्व और छत्व","तोर्लि: तत्+लयः = तल्लयः। शश्छोऽटि: तत्+श्रुत्वा = तच्छ्रुत्वा।"]]],["4. विसर्ग संधि",[["सत्व","विसर्जनीयस्य सः: नमः+ते = नमस्ते; रामः+तरति = रामस्तरति।"],["उत्व","अतो रोरप्लुतादप्लुते और हशि च: शिवः+अर्च्यः = शिवोऽर्च्यः; मनः+रथः = मनोरथः।"],["रेफ लोप","रो रि और ढ्रलोपे पूर्वस्य दीर्घोऽणः: पुनर्+रमते = पुना रमते; निः+रोगः = नीरोगः।"]]]]));
S[9].t.push(HS("संस्कृत व्याकरण: कारक और विभक्ति",[["1. छह कारक",[["विभक्ति से मेल","कर्ता-प्रथमा, कर्म-द्वितीया, करण-तृतीया, सम्प्रदान-चतुर्थी, अपादान-पञ्चमी, अधिकरण-सप्तमी। सम्बन्ध और सम्बोधन कारक नहीं माने जाते।"],["परिभाषाएँ","कर्ता = क्रिया में सबसे स्वतंत्र; कर्म = कर्ता का सबसे इष्ट; करण = सबसे सहायक साधन; सम्प्रदान = दान से जिसे संतुष्ट किया जाए; अपादान = अलग होना; अधिकरण = आधार।"]]],["2. द्वितीया",[["योग","अभितः, परितः, उभयतः, सर्वतः, धिक्, अन्तरेण, अन्तरा के योग में। ग्रामं परितः वृक्षाः।"],["अत्यन्त संयोग","कालाध्वनोरत्यन्तसंयोगे: मासमधीते; क्रोशं कुटिला नदी।"],["द्विकर्मक","अकथितं च से 16 धातु द्विकर्मक: गां दोग्धि पयः; बलिं याचते वसुधाम् (बलि गौण कर्म)। अधि+शीङ्/स्था/आस् में आधार की कर्म संज्ञा।"]]],["3. तृतीया",[["सामान्य नियम","करण और अनुक्त कर्ता में। सह, साकम्, सार्धम्, समम् के योग में अप्रधान में।"],["मुख्य सूत्र","येनाङ्गविकारः (अक्षिणा काणः); अपवर्गे तृतीया (मासेन व्याकरणं श्रुतम्); इत्थंभूतलक्षणे (जटाभिः तापसः); हेतौ (पुण्येन दृष्टो हरिः)।"]]],["4. चतुर्थी",[["सामान्य नियम","सम्प्रदान में। नमः, स्वस्ति, स्वाहा, स्वधा और सामर्थ्य अर्थ वाले अलम् के योग में (दैत्येभ्यो हरिः अलम्)।"],["मुख्य सूत्र","रुच्यर्थानां प्रीयमाणः (बालकाय मोदकं रोचते)। क्रुध्, द्रुह्, ईर्ष्य, असूय के योग में जिस पर क्रोध हो उसमें चतुर्थी।"]]],["5. पञ्चमी",[["अपादान","ध्रुवमपायेऽपादानम्: वृक्षात् पत्रं पतति।"],["मुख्य सूत्र","भीत्रार्थानां भयहेतुः (चौराद् बिभेति); आख्यातोपयोगे (उपाध्यायाद् अधीते); जनिकर्तुः प्रकृतिः (ब्रह्मणः प्रजाः प्रजायन्ते); भुवः प्रभवश्च (हिमवतो गङ्गा प्रभवति)।"],["विना, पृथक्, नाना","इनके योग में द्वितीया, तृतीया और पञ्चमी तीनों होती हैं।"]]],["6. प्रथमा, षष्ठी और सप्तमी",[["प्रथमा","प्रातिपदिकार्थ, लिंग, परिमाण और वचन मात्र में।"],["षष्ठी","षष्ठी शेषे (स्व-स्वामी आदि सम्बन्ध)। यतश्च निर्धारणम् (कवीनां कालिदासः श्रेष्ठः): निर्धारण में षष्ठी और सप्तमी।"],["सप्तमी","अधिकरण में। यस्य च भावेन भावलक्षणम् (गोषु दुह्यमानासु गतः)।"],["अलम्","निषेध अर्थ में तृतीया: अलं विवादेन।"]]]]));

्यक राजा।"],["विशाखदत्त","मुद्राराक्षसम्: राजनीतिक नाटक; नायिका और विदूषक रहित; चाणक्य (विष्णुगुप्त), अमात्य राक्षस, चन्दनदास, निपुणक।"],["भवभूति","उत्तररामचरितम् (7 अंक; तृतीय छाया अंक; 'एको रसः करुण एव'), महावीरचरितम्, मालतीमाधवम् (प्रकरण, 10 अंक)।"],["अन्य","भट्टनारायण: वेणीसंहारम् (6 अंक, वीर रस)। हर्षवर्धन: रत्नावली (नाटिका, 4 अंक), प्रियदर्शिका, नागानन्दम् (जीमूतवाहन, शान्त रस)। कृष्णमिश्र: प्रबोधचन्द्रोदयम् (प्रतीकात्मक)।"]]],["6. गद्य साहित्य",[["बाणभट्ट","हर्षवर्धन के सभापण्डित। कादम्बरी (चन्द्रापीड, शुक वैशम्पायन, महाश्वेता; उत्तरार्द्ध भूषणभट्ट ने पूरा किया); हर्षचरितम् (8 उच्छ्वास, प्रथम ऐतिहासिक आख्यायिका)। 'बाणोच्छिष्टं जगत् सर्वम्'।"],["दण्डी","दशकुमारचरितम् (नायक राजवाहन, अवन्तिसुन्दरी; सप्तम उच्छ्वास में ओष्ठ्य वर्ण नहीं); काव्यादर्श; 'उपमा कालिदासस्य' पदलालित्य की प्रशंसा।"],["सुबन्धु","वासवदत्ता: श्लेषमय गद्यकाव्य; नायक कन्दर्पकेतु।"]]]]));
